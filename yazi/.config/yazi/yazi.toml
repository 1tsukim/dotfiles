# ~/.config/yazi/yazi.toml — レイアウト・プレビュー設定
# 上書きしない項目は yazi 既定値が適用される。

# ========== ペイン比率 [parent : current : preview] ==========
# 既定 [1, 4, 3] では preview が狭く、横長 PNG が右側で切れがち。
# preview を一段広く取ると PR 曲線 PNG が収まりやすい。
[mgr]
ratio = [1, 3, 4]

# ========== プレビュー設定 ==========
[preview]
# 画像を最大このピクセル数までリサイズ。preview ペインのピクセル幅以下にする。
# yazi はこの値と実ペイン幅の小さい方に縮小する。
max_width  = 1200
max_height = 1200

# 高品質リサンプリング（既定 "triangle" より滑らか）
image_filter  = "lanczos3"
image_quality = 90

# 移動して止まってから何ミリ秒でプレビューを更新するか（既定 30）
image_delay   = 30
