# ~/.tmux.conf — 推奨設定の移植版

# ---- 端末・色 ----
# tmux-256color + true color (24bit)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",alacritty:Tc"

# カーソル形状 (DECSCUSR) をパススルー: 端末側 cursor-style = bar 等を反映
set -as terminal-features ',*:cstyle'

# ---- 履歴 ----
# 既定2000は少なすぎ。ログ追跡に十分な行数
set -g history-limit 50000

# ---- マウス・スクロール ----
set -g mouse on

# ホイールの飛び対策
# 代替スクリーン中 (Vim/Neovim/less等) はアプリへイベントを渡す
# それ以外は copy-mode に入って1行ずつスクロール
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "if-shell -F '#{pane_in_mode}' 'send-keys -X -N 1 scroll-up' 'copy-mode; send-keys -X -N 1 scroll-up'"
bind -n WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "if-shell -F '#{pane_in_mode}' 'send-keys -X -N 1 scroll-down' ''"
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down-and-cancel
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down-and-cancel

# ---- パススルー ----
# 画像表示・OSC 52クリップボード等を通す
set -g allow-passthrough on

# ---- 描画 ----
# 透過ターミナル使用時の残像対策 (ウィンドウ切替後に再描画)
set-hook -g after-select-window 'refresh-client'

# ---- ペイン分割 (作業ディレクトリ継承) ----
# prefix + | : 横並び / prefix + - : 縦並び
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# ---- ウィンドウ切替 ----
# Shift + ←/→ で prefix なし切替
bind -n S-Left  previous-window
bind -n S-Right next-window

# ---- コピーモード (vi) ----
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# macOS: yank時にpbcopyへ流す
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ---- セッション安全装置 ----
# 誤kill防止: prefix + X で確認プロンプト
bind X confirm-before -p "Kill session? (y/n)" kill-session

# ---- ステータスバー装飾 (Tokyo Night風) ----
# パレット: 235=深い紺グレー / 188=オフホワイト / 60=ダルパープル(dim)
#          111=スカイブルー / 141=ラベンダー / 237=罫線用ダーク
set -g status-position bottom
set -g status-bg colour235
set -g status-fg colour188
set -g status-justify left
set -g status-interval 60

# 左側: セッション名を青でアクセント、細罫線で区切り
set -g status-left ' #[fg=colour111,bold]#S #[fg=colour237]│'
set -g status-left-length 30

# 右側: 日付 (dim) + 時刻 (強調) のみ。情報は載せない
set -g status-right '#[fg=colour60]%m/%d #[fg=colour188,bold]%H:%M '
set -g status-right-length 30

# ウィンドウ一覧: 現在のみ紫アクセント線、非現在はくすみ色
setw -g window-status-current-format '#[fg=colour141,bold] ▎#I:#W#F '
setw -g window-status-format         '#[fg=colour60]  #I:#W#F '
setw -g window-status-separator      ''

# ---- チートシート行 (4行ステータス) ----
# 上3行に階層メモ+カテゴリ別キー。覚えたらprefix+Hで非表示
set -g status 4

# 最上段 (line 3): 階層メモ (SES⊃WIN⊃PANE と s/w の違い)
set -g status-format[3] "#[bg=colour231,fg=colour235] 階層:  #[fg=colour161,bold]SES#[fg=colour235,nobold](作業環境全体)  ⊃  #[fg=colour161,bold]WIN#[fg=colour235,nobold](タブ)  ⊃  #[fg=colour22,bold]PANE#[fg=colour235,nobold](画面分割)"

# 上段 (line 2): ペイン操作
set -g status-format[2] "#[bg=colour237,fg=colour188] #[fg=colour215,bold]Ctrl+b#[fg=colour188,nobold] #[fg=colour149,bold]PANE#[fg=colour188,nobold]  #[fg=colour111,bold]|/-#[fg=colour188] split  #[fg=colour111,bold]↑↓←→#[fg=colour188] select  #[fg=colour111,bold]z#[fg=colour188] zoom  #[fg=colour111,bold]o#[fg=colour188] cycle  #[fg=colour111,bold]Space#[fg=colour188] layout  #[fg=colour111,bold]x#[fg=colour188] kill"

# 中段 (line 1): ウィンドウ/セッション操作 + コピー
set -g status-format[1] "#[bg=colour237,fg=colour188] #[fg=colour215,bold]Ctrl+b#[fg=colour188,nobold] #[fg=colour213,bold]WIN/SES#[fg=colour188,nobold]  #[fg=colour111,bold]c#[fg=colour188] new  #[fg=colour111,bold],#[fg=colour188] rename  #[fg=colour111,bold]Shift + ←→#[fg=colour188] switch  #[fg=colour111,bold]l#[fg=colour188] last-win  #[fg=colour111,bold]w#[fg=colour188] win-list  #[fg=colour111,bold]s#[fg=colour188] ses-list  #[fg=colour111,bold]d#[fg=colour188] detach  #[fg=colour111,bold]X#[fg=colour188] kill-ses  #[fg=colour111,bold]:#[fg=colour188] cmd"

# prefix + H でチートシート行を表示/非表示トグル (4⇄1)
bind H if -F '#{==:#{status},1}' 'set status 4' 'set status 1'
